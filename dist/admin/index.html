<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>关卡制作后台</title><link rel="stylesheet" href="./style.css"></head><body><main><header><h1>关卡制作后台</h1><p>本地内容工具 · 与玩家界面分离</p></header><section class="controls"><label>生成模式<select id="mode"><option value="opening">第一关教学</option><option value="intro">入门模板</option><option value="standard">常规模板</option><option value="complex">复杂模板</option></select></label><label>种子<input id="seed" value="内容验证-1" maxlength="80"></label><button id="generate">生成关卡</button><label class="file-button">导入JSON<input id="file" type="file" accept="application/json,.json"></label><button id="export">导出关卡</button><button id="validate">校验参考解</button></section><section class="reference-section"><h2>参考布局</h2><div id="reference-preview"></div></section><div class="editor"><label>关卡数据<textarea id="json" spellcheck="false" aria-label="关卡数据"></textarea></label><section><h2>校验结果</h2><pre id="result" role="status"></pre></section></div></main><script type="module" src="./editor.js"></script></body></html>
